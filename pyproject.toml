[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-chief-of-staff-engine"
dynamic = ["version"]
description = "A memory engine and operating loop for an AI chief of staff."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Joshua Polasky" }]
dependencies = [
    "jsonschema>=4",
    "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/jdpolasky/ai-chief-of-staff-engine"

[project.scripts]
cos = "cos.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "cos.__version__" }

[tool.setuptools.packages.find]
include = ["cos*"]

[tool.setuptools.package-data]
"cos.memory" = ["schema.sql"]
"cos.braid" = ["contracts/*.json"]
