name: regress

on:
  push:
  pull_request:

jobs:
  regress:
    name: regress (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: python -m pip install -e .
      - name: Run the probe suite
        env:
          COS_VAULT: ${{ runner.temp }}/cos-vault
          COS_STATE_DIR: ${{ runner.temp }}/cos-state
        run: python -m cos regress
